name: Label by area

# Reads the Area dropdown from the issue forms and adds the matching label.
on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const m = /### Area\s+(art|music|sfx|code|docs)/.exec(context.payload.issue.body || '');
            if (!m) return;
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.payload.issue.number,
              labels: [m[1]],
            });
